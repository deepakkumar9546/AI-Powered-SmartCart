<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartCart</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="/style.css" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
  <a class="navbar-brand fw-bold" href="#">🛒 SmartCart</a>
  <div class="d-flex align-items-center gap-2 ms-auto" id="nav-links"></div>
</nav>

<div class="container py-4">

  <!-- Auth view -->
  <div id="view-auth" class="row justify-content-center">
    <div class="col-md-5">
      <ul class="nav nav-tabs" id="authTabs">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#loginPane">Login</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#registerPane">Register</button></li>
      </ul>
      <div class="tab-content border border-top-0 p-3 bg-white">
        <div class="tab-pane fade show active" id="loginPane">
          <h5>Login</h5>
          <input class="form-control mb-2" id="login-email" placeholder="Email (e.g. customer1@smartcart.com)">
          <input class="form-control mb-2" id="login-password" type="password" placeholder="Password">
          <button class="btn btn-primary w-100" onclick="login()">Login</button>
          <div class="form-text mt-2">Demo admin: admin@smartcart.com / Admin@123<br/>Demo customer: customer1@smartcart.com / Password123!</div>
        </div>
        <div class="tab-pane fade" id="registerPane">
          <h5>Register</h5>
          <input class="form-control mb-2" id="reg-name" placeholder="Full name">
          <input class="form-control mb-2" id="reg-email" placeholder="Email">
          <input class="form-control mb-2" id="reg-password" type="password" placeholder="Password (min 6 chars)">
          <div class="row g-2 mb-2">
            <div class="col"><input class="form-control" id="reg-age" type="number" placeholder="Age"></div>
            <div class="col">
              <select class="form-select" id="reg-gender">
                <option>Male</option><option>Female</option><option>Other</option>
              </select>
            </div>
          </div>
          <input class="form-control mb-2" id="reg-city" placeholder="City">
          <select class="form-select mb-2" id="reg-role">
            <option value="customer">Customer</option>
            <option value="admin">Admin</option>
          </select>
          <button class="btn btn-success w-100" onclick="register()">Register</button>
        </div>
      </div>
      <div id="auth-message" class="mt-2 text-danger"></div>
    </div>
  </div>

  <!-- App views (shown after login) -->
  <div id="view-app" class="d-none">
    <ul class="nav nav-pills mb-3" id="appTabs">
      <li class="nav-item"><button class="nav-link active" data-pane="products">Products</button></li>
      <li class="nav-item"><button class="nav-link" data-pane="cart">Cart</button></li>
      <li class="nav-item"><button class="nav-link" data-pane="orders">Orders</button></li>
      <li class="nav-item"><button class="nav-link" data-pane="recommendations">Recommendations</button></li>
      <li class="nav-item"><button class="nav-link" data-pane="dashboard">Dashboard</button></li>
      <li class="nav-item d-none" id="admin-tab"><button class="nav-link" data-pane="admin">Admin</button></li>
    </ul>

    <div class="app-pane" id="pane-products">
      <div class="row g-2 mb-3">
        <div class="col-auto"><input class="form-control" id="product-search" placeholder="Search products..."></div>
        <div class="col-auto">
          <select class="form-select" id="product-category">
            <option value="">All categories</option>
          </select>
        </div>
        <div class="col-auto"><button class="btn btn-outline-primary" onclick="loadProducts()">Search</button></div>
      </div>
      <div id="products-grid" class="row g-3"></div>
    </div>

    <div class="app-pane d-none" id="pane-cart">
      <h4>My Cart</h4>
      <div id="cart-table"></div>
    </div>

    <div class="app-pane d-none" id="pane-orders">
      <h4>My Orders</h4>
      <div id="orders-table"></div>
    </div>

    <div class="app-pane d-none" id="pane-recommendations">
      <h4>Recommended For You</h4>
      <div id="recommendations-list" class="row g-3"></div>
    </div>

    <div class="app-pane d-none" id="pane-dashboard">
      <h4>Customer Dashboard</h4>
      <div id="dashboard-content"></div>
    </div>

    <div class="app-pane d-none" id="pane-admin">
      <h4>Admin Analytics</h4>
      <div id="admin-content"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
